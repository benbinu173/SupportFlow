# Security headers, as an `include` rather than as literal directives in each block.
#
# This file exists because of one nginx rule that is easy to read past: **`add_header` is not
# additive across blocks.** If a `location` block has *any* `add_header` of its own, the parent's
# `add_header` directives are discarded entirely for that location — not merged, not inherited.
#
# That rule was silently in force here. `location /assets/` sets `Cache-Control` and
# `location = /index.html` sets `Cache-Control` and a CSP, so both lost every security header
# the server block had set: `nosniff`, `X-Frame-Options`, `Referrer-Policy`, and
# `Cross-Origin-Opener-Policy`. The `index.html` case is the one that matters — it is the only
# response from this server that is a *document*, which is precisely where `X-Frame-Options`
# and a CSP have any effect at all. The cache rules were working and the headers protecting the
# page were not, which is the shape of the bug this file prevents: the visible behaviour was
# correct and the invisible behaviour was missing.
#
# So every block that sets a header `include`s this file, and none of them can drop the set by
# adding one of its own. The cost is that `/assets/` responses carry a CSP, which is inert —
# `Content-Security-Policy` is enforced on documents only — and a few bytes on a response that
# is cached for a year. Paying that to keep one list in one place is the trade this makes.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The one header the API has no equivalent for. A CSP governs what a *document* may load, and
# this is the only server here that returns documents — which is why the backend omits it and
# this does not.
#
# `style-src` allows inline styles because React writes them as `style` attributes and a CSP
# without `'unsafe-inline'` blocks the attribute, not just `<style>` blocks. `script-src` does
# *not* get that exemption: an inline script is the thing a CSP exists to stop, and the Vite
# build emits only external hashed files.
#
# `connect-src 'self'` covers the API and the WebSocket: same-origin `'self'` matches `ws://`
# and `wss://` on the same host, which is where `app/websocket` puts the socket.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
