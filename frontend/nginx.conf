# SupportFlow frontend — static hosting.
#
# Mounted as a conf.d snippet, so this is a `server` block and not a whole config file. Caddy
# (`docker/Caddyfile`) terminates TLS and routes `/api`, `/ws`, and `/health` to the backend
# before anything reaches this server; by the time a request arrives here it is a request for
# a file.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Drop the version banner. `Server: nginx/1.27.3` tells a scanner which advisories to try,
    # and gains nothing — nothing in this deployment's operation depends on knowing the point
    # release from a header.
    server_tokens off;

    # Uploads and API bodies belong to the backend; this server only ever answers GETs for a
    # handful of files. A ceiling keeps an oversized body from being buffered here at all.
    client_max_body_size 1m;

    # --- Security headers --------------------------------------------------
    # Included here *and* in every `location` below that sets a header of its own, because
    # `add_header` does not inherit once a block has one — see the file for why that matters.
    # Included at the server level too, so a location added later without a header of its own
    # is still covered.
    include /etc/nginx/snippets/supportflow-headers.conf;

    # --- Caching -----------------------------------------------------------
    # Two rules, and getting them backwards is the classic deployment bug.
    #
    # Vite writes every asset to `assets/` with a content hash in the name, so a given URL's
    # bytes never change and it can be cached permanently. `index.html` is the opposite: it is
    # the file that names the current hashes, so a cached copy serves the previous release
    # forever — the user sees the old app and no amount of reloading helps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/supportflow-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/supportflow-headers.conf;
    }

    # --- SPA fallback ------------------------------------------------------
    # The client router owns `/tickets/123`, so a deep link that nginx looked up as a file
    # would 404 on refresh while working perfectly on click-through. Anything that is not a
    # real file falls back to the app shell, which then routes it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
