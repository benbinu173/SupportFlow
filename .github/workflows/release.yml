# SupportFlow — release.
#
# Everything a release *can* do without a host: verify the tagged commit, build both
# production images, and publish them to GitHub Container Registry with provenance and an
# SBOM. The deploy itself is a runbook in the README, because there is no cloud account
# configured here and a workflow that pretended to deploy would be a workflow that either did
# nothing or lied about having done something.
#
# Publishing is nonetheless the real half. A digest in GHCR is a verifiable artifact: it can be
# pulled by anyone, it records the commit that produced it, and it is what `docker compose`
# pulls on a host that has this repository checked out but no build toolchain.

name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs, for re-publishing a tag whose build failed on an infrastructure flake.
  #
  # **There is no `tag` input, and that is the fix rather than an omission.** The first version
  # of this file declared a required `tag` input and then never read it: the checkout step took
  # the default ref, and `docker/metadata-action` derives its version tags from `github.ref`, so
  # a manual run would have built the branch head and published it with no version tags at all —
  # while its own comment claimed it was re-publishing a tag. An input that looks like it
  # controls something and does not is worse than no input.
  #
  # The mechanism that actually works is the dispatch UI's ref picker: `workflow_dispatch` can be
  # run against a tag, and choosing one sets `github.ref` to `refs/tags/v1.0.0`, which is exactly
  # what checkout and the metadata action both read. So the tag is selected where GitHub already
  # knows how to select it, and nothing here has to be trusted to match what was typed.
  workflow_dispatch:

# `packages: write` is what allows pushing to GHCR. `id-token: write` is for the provenance
# attestation, which is signed against the workflow's OIDC identity rather than a stored key —
# that is the property that lets a consumer verify the image came from this repository and this
# commit, and it is why no long-lived registry secret appears anywhere in this file.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  # The tagged commit is verified by the same jobs that gate `main`, called rather than copied.
  # A release whose images were never tested is worse than no release, and the tag is the one
  # ref where "it passed on main earlier" is not quite the same statement.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: [verify]

    strategy:
      # Both images are independent. A failure in one should not cancel the other's push —
      # a half-published release is easier to finish than to start over.
      fail-fast: false
      matrix:
        include:
          - image: supportflow-backend
            context: ./backend
          - image: supportflow-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v5
        with:
          # Annotated tags are the default here, and `--depth=1` would not fetch the tag's
          # target for the metadata step below.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The workflow's own token. It expires with the job, so there is no registry
          # credential in this repository to leak or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag for the version, one for the major.minor, and one for the commit — so a
      # deployment can pin as tightly or as loosely as it wants, and a digest always resolves
      # back to an exact commit.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.image == 'supportflow-backend' && 'production' || 'runtime' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both are attached to the image in the registry. An SBOM answers "what is in this
          # image" for a CVE scanner; provenance answers "who built it and from what", which is
          # the question that matters when a tag can be moved but a digest cannot.
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Printed rather than stored: the README's runbook tells an operator to deploy by digest,
      # and this is the line they copy it from.
      - name: Report the published digest
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
