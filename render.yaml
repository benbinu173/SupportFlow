# Free demo only. External account credentials are entered in Render settings.
services:
  - type: web
    name: supportflow-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/Dockerfile.preview
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: KNOWLEDGE_ENABLED
        value: "false"
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: supportflow-attachments
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        value: mail.smtp2go.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        value: ""
