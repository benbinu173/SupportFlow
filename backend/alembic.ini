# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. The database URL contains
# credentials and this file is committed, so env.py reads DATABASE_URL from the
# application settings instead. Point a run at a different database by setting that
# environment variable — not by editing this file, and not by adding a URL below.
# One source of truth, never in version control.

[alembic]
script_location = alembic

# Timestamp-prefixed revision files keep `ls alembic/versions` in creation order,
# which is how a reviewer wants to read them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Migration files are read from disk only; no dynamic module loading.
prepend_sys_path = .

# How Alembic splits multi-valued options such as prepend_sys_path on this platform.
# `os` is what Alembic recommends, and is required: without it the value is split on
# spaces, commas, and colons, which breaks Windows paths containing a drive colon.
path_separator = os

[post_write_hooks]
# Formatting is applied by `make fix` rather than on write, so a generated
# migration can be reviewed in its raw state before anything rewrites it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
