[project]
name = "supportflow-backend"
version = "0.1.0"
description = "SupportFlow — AI-assisted multi-tenant customer support platform (API)"
requires-python = ">=3.12"

# Pinned deliberately: local dev, Docker, and CI must resolve identically.
# See docs/architecture-decisions.md ADR-005.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "pgvector==0.5.0",
    "redis==8.1.0",
    "celery==5.6.3",
    "boto3==1.43.93",             # S3-compatible object storage for attachments
    "pyjwt[crypto]==2.13.0",       # ADR-002
    "pwdlib[argon2]==0.3.1",       # ADR-001
    "email-validator==2.3.0",      # required by pydantic.EmailStr
    "python-multipart==0.0.20",
    "structlog==25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "ruff==0.15.1",
    "mypy==1.19.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "ASYNC",    # async correctness
    "S",        # bandit security
    "T20",      # no print statements
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the intended idiom
]

[tool.ruff.lint.isort]
# Stated explicitly rather than inferred from `src`. Without this, `app.*` is read as
# a third-party package and sorted in among `fastapi` and `pytest`, while `tests.*`
# lands in its own block — so the same file had two different answers for "is this our
# code?". An import block that cannot be scanned for third-party dependencies at a
# glance is the whole reason the rule exists.
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and hardcoded credentials.
"tests/**" = ["S101", "S105", "S106"]
# Alembic generates its own style.
"alembic/**" = ["E501", "I001"]
# Operator scripts report to a person rather than a log, so they print and assert, and
# they carry a throwaway account password the same way the tests do.
"scripts/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# boto3 and botocore ship no `py.typed` marker, so strict mode refuses to analyse them.
# The alternative is `boto3-stubs[s3]`, which pins its own boto3 version and drags in
# `mypy-boto3-s3` and `botocore-stubs` for the four S3 calls this project makes — a
# larger and more brittle dependency than the thing it types. `app/core/storage.py` is
# the only module that imports either, and it is a thin translation layer over them:
# every call is wrapped, every failure becomes a domain error, and the untyped objects
# never escape it.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# Celery ships no `py.typed` marker either, and unlike boto3 there is no stub package in
# the ecosystem — `celery-types` exists but lags the releases this project pins. The
# consequence is narrow and confined to `app/workers/celery_app.py`, where the app object
# is configured with keyword arguments mypy cannot check and would not have checked
# anyway: Celery's settings are a loose string-keyed namespace at runtime. Everything the
# application actually does with a task — `send_notification_email.delay(...)` — is
# reached through `app/workers/email_tasks.py`, whose own function is fully annotated.
#
# `app/workers/email_tasks.py` carries a per-line `untyped-decorator` suppression rather
# than an exemption here: that module's body is typed, and only the decorator that turns
# its function into a task is not.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "billiard", "billiard.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: isolated, no external services",
    "integration: requires Postgres and/or Redis",
    "security: authz, authn, and tenant-isolation guarantees",
]
