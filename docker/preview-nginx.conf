worker_processes 1;
pid /tmp/supportflow-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Logging paths only keeps reset/verification credentials out of access logs.
    log_format safe '$request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Render terminates TLS; never derive the forwarding scheme from public headers.
    server {
        listen __PORT__;
        server_name _;
        server_tokens off;
        root /app/public;
        index index.html;
        client_max_body_size 26m;
        include /app/frontend-headers.conf;

        location ~ ^/(api(?:/|$)|health(?:/|$)|ws$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Uvicorn skips loopback and Render's private 10/8 proxy hops,
            # then selects the rightmost untrusted address in the chain.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
            proxy_buffering off;
            # Keep API errors/security headers from the application itself.
            add_header Cache-Control "no-store" always;
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include /app/frontend-headers.conf;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /app/frontend-headers.conf;
        }
        location = /theme-init.js {
            add_header Cache-Control "no-cache" always;
            include /app/frontend-headers.conf;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
